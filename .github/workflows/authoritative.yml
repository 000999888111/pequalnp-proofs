# AUTHORITATIVE check of one pull request. Started by hand (workflow_dispatch) from the base
# repository, with the pull request number and the gap id. Its verdict is the one that counts.
#
# The rule behind every guard below: the only thing taken from the pull request is the bytes of
# one Lean file. The fork is never checked out. Nothing from it runs, except that Lean compiles
# that one file, and a Lean file can run code while it compiles. So that compile is treated as
# hostile: it runs as a separate account that cannot write the checker, the verifier, the pinned
# library, the definitions or the statement, cannot reach the network, and never sees the
# GitHub credential of this run (.github/scripts/lake-locked.sh).
name: authoritative

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      gap:
        description: Gap id, for example L-gct-101
        required: true
        type: string

# Least privilege: read the code and read the pull request. This run cannot write anything.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: authoritative-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # Inputs are free text typed by whoever starts the run. They reach the scripts only as
      # environment variables, and the next step refuses anything but digits and a plain id.
      # They are never pasted into a script with the workflow's own expression syntax.
      PR: ${{ inputs.pr }}
      GAP: ${{ inputs.gap }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GAPS_URL: https://data.pequalnp.com/data/desk/gaps.json
      API: https://api.github.com
      W: /opt/pnp
    steps:
      - name: Refuse malformed inputs and a run from another branch
        run: |
          set -eu
          printf '%s' "$PR" | grep -Eqx '[1-9][0-9]{0,6}' || { echo "REFUSED: pr must be a number"; exit 1; }
          printf '%s' "$GAP" | grep -Eqx 'L-[a-z0-9]+(-[a-z0-9]+)*' || { echo "REFUSED: gap must look like L-gct-101"; exit 1; }
          [ "${#GAP}" -le 64 ] || { echo "REFUSED: gap id too long"; exit 1; }
          # Only the default branch holds the checker and this file as they were reviewed.
          [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ] || { echo "REFUSED: start this run from $DEFAULT_BRANCH"; exit 1; }
          sudo mkdir -p "$W" && sudo chown "$(id -u):$(id -g)" "$W"
          mkdir -p "$W/in" "$W/api"

      - name: Check out the BASE only (plain git, no stored credentials)
        run: |
          set -eu
          # No checkout action: plain git leaves no credential in .git for later steps to find.
          git init -q "$W/base"
          git -C "$W/base" fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -C "$W/base" checkout -q --detach FETCH_HEAD
          [ "$(git -C "$W/base" rev-parse HEAD)" = "$GITHUB_SHA" ]
          echo "base commit: $GITHUB_SHA"

      - name: Read the pull request through the API and refuse anything but one added proof file
        env:
          # The credential of this run, read only, given to this step and the next one alone.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          get() { curl -sSf --proto '=https' --max-redirs 0 --max-filesize 20000000 \
                    -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" -o "$2" "$API/repos/$GITHUB_REPOSITORY/$1"; }
          get "pulls/$PR" "$W/api/pr.json"
          get "pulls/$PR/files?per_page=100" "$W/api/files.json"
          # The head commit, as a 40 character hash, before it is used in a URL.
          head=$(jq -r '.head.sha // ""' "$W/api/pr.json")
          printf '%s' "$head" | grep -Eqx '[0-9a-f]{40}' || { echo "REFUSED: the pull request has no head commit"; exit 1; }
          # The whole tree of the head commit: it says whether the file is a plain file or a link.
          get "git/trees/$head?recursive=1" "$W/api/tree.json"
          # One place decides: exactly one file, added, under lean/PEqualNP/Outside/, the allowed
          # name (so no path can climb out with ..), a plain file, at most 512 KiB, nothing else.
          node "$W/base/.github/scripts/outside-guard.mjs" pr "$W/api/pr.json" "$W/api/files.json" "$W/api/tree.json" \
            "$GITHUB_REPOSITORY" "$DEFAULT_BRANCH" "$W/in"
          [ ! -e "$W/base/$(cat "$W/in/pr.file")" ] || { echo "REFUSED: the file already exists in the base"; exit 1; }

      - name: Download that one file as data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          blob=$(cat "$W/in/pr.blob")
          # The content is fetched by its hash, as bytes, into a plain file this run creates.
          # Whatever the pull request made of the path (a link, a mode), only bytes arrive.
          curl -sSf --proto '=https' --max-redirs 0 --max-filesize 524288 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" -o "$W/in/proof.lean" "$API/repos/$GITHUB_REPOSITORY/git/blobs/$blob"
          [ "$(wc -c < "$W/in/proof.lean")" -le 524288 ] || { echo "REFUSED: the file is larger than 512 KiB"; exit 1; }
          # The bytes must be the ones the pull request names.
          [ "$(git hash-object "$W/in/proof.lean")" = "$blob" ] || { echo "REFUSED: the downloaded bytes are not the file of the pull request"; exit 1; }

      - name: The posted statement for the gap, and the import rule
        run: |
          set -eu
          # The statement comes from the desk's public list, never from the pull request.
          curl -sSf --proto '=https' --max-redirs 0 --max-filesize 5000000 -o "$W/in/gaps.json" "$GAPS_URL"
          node "$W/base/.github/scripts/outside-guard.mjs" gap "$W/in/gaps.json" "$GAP" "$(cat "$W/in/pr.file")" "$W/in"
          # Before anything is built: the file may import Mathlib and the modules the gap lists.
          node "$W/base/.github/scripts/outside-guard.mjs" imports "$W/in/proof.lean" "$W/in/imports.json"

      - name: Install the pinned Lean toolchain
        run: |
          set -eu
          export ELAN_HOME="$W/elan"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --no-modify-path --default-toolchain none
          "$ELAN_HOME/bin/elan" toolchain install "$(cat "$W/base/lean/lean-toolchain")"
          cd "$W/base/lean"
          # The real binaries of the pinned toolchain, so the check does not depend on a launcher.
          tc=$(dirname "$("$ELAN_HOME/bin/elan" which lake)")
          [ -x "$tc/lake" ] && [ -x "$tc/lean" ]
          echo "TC_BIN=$tc" >> "$GITHUB_ENV"

      - name: Fetch the prebuilt Mathlib and build the trusted parts
        run: |
          set -eu
          cd "$W/base/lean"
          export PATH="$TC_BIN:$PATH" PEQUALNP_REAL_LAKE="$TC_BIN/lake" PEQUALNP_HOME="$W/queue" LAKE_ARTIFACT_CACHE=false
          "$TC_BIN/lake" exe cache get
          # Base code only: the verifier, the definitions, and the modules the gap lets the file
          # import. The proof file is not in the tree yet, so nothing of it is compiled here.
          set -- checklemma +PEqualNP.Defs
          while IFS= read -r m; do if [ -n "$m" ]; then set -- "$@" "+$m"; fi; done < "$W/in/imports.txt"
          ../tools/bin/lake build "$@"

      - name: Put the file in place and lock the tree
        run: |
          set -eu
          file=$(cat "$W/in/pr.file")
          install -m 0644 "$W/in/proof.lean" "$W/base/$file"
          # git refuses a tree owned by another account unless told the tree is safe.
          printf '[safe]\n\tdirectory = *\n' > "$W/in/gitconfig"
          # The account the hostile compile runs as. It has no sudo and owns almost nothing.
          sudo useradd --system --create-home --shell /usr/sbin/nologin outsider
          # Nothing under $W is writable by that account ...
          chmod -R a+rX,go-w "$W"
          # ... except the output directories of its own module. It cannot create a file
          # anywhere else in the tree, so it cannot plant a setting, a package or a library.
          for d in lib/lean ir; do
            mkdir -p "$W/base/lean/.lake/build/$d/PEqualNP/Outside"
            sudo chown outsider:outsider "$W/base/lean/.lake/build/$d/PEqualNP/Outside"
          done
          # What the verdict will be about, hashed before the hostile step runs.
          ( cd "$W" && sha256sum "base/$file" in/statement.txt base/tools/check-lean.mjs base/tools/build.sh \
              base/tools/bin/lake base/lean/CheckLemma.lean base/lean/.lake/build/bin/checklemma \
              base/.github/scripts/lake-locked.sh ) | tee "$RUNNER_TEMP/before.sha256"

      - name: Run the BASE checker on the file (the only step that runs outside code)
        id: run
        run: |
          # The checker's exit code is read below, so a nonzero one must not end this step.
          set +e -u
          file=$(cat "$W/in/pr.file")
          node_bin=$(dirname "$(readlink -f "$(command -v node)")")
          cd "$W/base"
          # The same command the project's own records are made with:
          #   node tools/check-lean.mjs <lean file> <statement file> check
          # The environment is emptied, so no credential of this run is in it. The checker and
          # the verifier run as this run's account. Every build goes through lake-locked.sh and
          # runs as `outsider` (see that file). The compile is another account than the checker,
          # so it cannot signal it, read or write its memory, or write to its output files.
          env -i HOME="$HOME" LANG=C.UTF-8 PATH="$TC_BIN:$node_bin:/usr/bin:/bin" \
              PEQUALNP_REAL_LAKE="$W/base/.github/scripts/lake-locked.sh" PEQUALNP_HOME="$W/queue" \
              PNP_TC_BIN="$TC_BIN" PNP_GITCONFIG="$W/in/gitconfig" \
            timeout -k 30 5400 node "$W/base/tools/check-lean.mjs" "$W/base/$file" "$W/in/statement.txt" check \
            > "$RUNNER_TEMP/checker.out" 2> "$RUNNER_TEMP/checker.err"
          code=$?
          # Nothing the compile started may outlive it.
          sudo pkill -KILL -u outsider || true
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Print the checker's last line, MANIFEST, and the verdict
        env:
          CODE: ${{ steps.run.outputs.code }}
        run: |
          set -u
          file=$(cat "$W/in/pr.file")
          # The trusted files must be what they were before the hostile step.
          ( cd "$W" && sha256sum "base/$file" in/statement.txt base/tools/check-lean.mjs base/tools/build.sh \
              base/tools/bin/lake base/lean/CheckLemma.lean base/lean/.lake/build/bin/checklemma \
              base/.github/scripts/lake-locked.sh ) > "$RUNNER_TEMP/after.sha256"
          same=yes; cmp -s "$RUNNER_TEMP/before.sha256" "$RUNNER_TEMP/after.sha256" || same=no
          last=$(tail -n 1 "$RUNNER_TEMP/checker.out")
          manifests=$(grep -c '^MANIFEST {' "$RUNNER_TEMP/checker.out" || true)
          # The output can quote the proof file. It is printed with workflow commands switched
          # off, so a line in it cannot pass for an instruction to the runner.
          stop="stop-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$stop"
          echo "----- checker diagnostics (tail) -----"
          tail -n 30 "$RUNNER_TEMP/checker.err"
          tail -n 40 "$RUNNER_TEMP/checker.out" | grep -v '^MANIFEST {' | cut -c1-2000
          echo "----- MANIFEST -----"
          grep '^MANIFEST {' "$RUNNER_TEMP/checker.out" || echo "(none)"
          echo "----- last line -----"
          printf '%s\n' "$last"
          echo "::$stop::"
          echo "----- what was checked -----"
          echo "pull request: $PR   gap: $GAP   author (credit): $(cat "$W/in/pr.author")"
          echo "head commit: $(cat "$W/in/pr.head")   file: $file   content hash: $(cat "$W/in/pr.blob")"
          echo "base commit: $GITHUB_SHA   statement sha256: $(sha256sum "$W/in/statement.txt" | cut -d' ' -f1)"
          echo "Merge only while the pull request's head is still the head commit above."
          # ACCEPTED needs all of: exit 0, an ACCEPTED last line, one MANIFEST line, untouched files.
          verdict=FAULT
          case "$CODE" in
            0) case "$last" in "ACCEPTED (check)"*) [ "$manifests" = 1 ] && [ "$same" = yes ] && verdict=ACCEPTED ;; esac ;;
            1) case "$last" in REJECTED*) verdict=REJECTED ;; esac ;;
          esac
          echo "VERDICT: $verdict (checker exit $CODE)"
          [ "$verdict" = ACCEPTED ] && exit 0
          [ "$verdict" = REJECTED ] && exit 1
          exit 3
